<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Logo do Assistente de Equipe">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- fundo -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- balão de conversa / cabeça do bot -->
  <path d="M184 120 H328 A48 48 0 0 1 376 168 V288 A48 48 0 0 1 328 336 H256 L188 392 V336 H184 A48 48 0 0 1 136 288 V168 A48 48 0 0 1 184 120 Z"
        fill="#FFFFFF"/>

  <!-- antena -->
  <rect x="250" y="76" width="12" height="46" rx="6" fill="#FFFFFF"/>
  <circle cx="256" cy="68" r="16" fill="url(#spark)"/>

  <!-- olhos -->
  <rect x="196" y="190" width="30" height="52" rx="15" fill="#4F46E5"/>
  <rect x="286" y="190" width="30" height="52" rx="15" fill="#4F46E5"/>

  <!-- sorriso -->
  <path d="M214 276 Q256 308 298 276" fill="none" stroke="#06B6D4" stroke-width="12" stroke-linecap="round"/>

  <!-- pontos de equipe -->
  <circle cx="396" cy="404" r="14" fill="#FFFFFF" fill-opacity="0.95"/>
  <circle cx="352" cy="428" r="10" fill="#FFFFFF" fill-opacity="0.7"/>
  <circle cx="430" cy="360" r="8" fill="#FFFFFF" fill-opacity="0.5"/>
</svg>
